<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Equations</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />

    <!-- KaTeX CSS & JS for LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>

    <style>
        /* ============================================================
           THEME & DESIGN SYSTEM (Warm Parchment Aesthetic)
           ============================================================ */
        :root {
            --bg-page: #f6f2e9;
            --bg-page-pattern: radial-gradient(circle at 50% 0%, #faf7f0 0%, #f3ede2 100%);
            --bg-card: #fcfaf4;
            --bg-card-inner: #f6f1e5;
            --bg-card-sub: #f0e9db;
            
            --border-main: #ded6bf;
            --border-light: #e8e1d0;

            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --text-muted: #78716c;

            --accent-orange: #d97706;

            /* Variable Color Palette */
            --color-purple: #7e22ce;
            --color-orange: #ea580c;
            --color-red: #dc2626;
            --color-teal: #0d9488;
            --color-green: #16a34a;
            --color-blue: #2563eb;

            --radius-main: 16px;
            --radius-inner: 12px;
            --radius-pill: 20px;
            --shadow-card: 0 10px 30px rgba(60, 48, 30, 0.07);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg-page);
            background-image: var(--bg-page-pattern);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0 16px 60px;
            line-height: 1.6;
        }

        /* Container Limit */
        .app-container {
            max-width: 980px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER (Clean & Minimal)
           ============================================================ */
        .museum-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(246, 242, 233, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0 16px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-light);
        }

        .museum-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #c2410c 0%, #ea580c 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
            flex-shrink: 0;
        }

        .brand-logo svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-text h1 {
            font-family: 'Newsreader', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #292524;
        }

        .museum-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .museum-nav a {
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            color: #57534e;
            transition: color 0.2s ease;
        }

        .museum-nav a:hover, .museum-nav a.active {
            color: var(--accent-orange);
        }

        /* ============================================================
           3-COLUMN VERTICALLY SCROLLABLE GRID OF CURVED SQUARES
           ============================================================ */
        .square-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .square-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border-main);
            border-radius: var(--radius-main);
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
            box-shadow: var(--shadow-card);
            text-decoration: none;
            color: inherit;
        }

        .square-card:hover {
            border-color: var(--accent-orange);
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(60, 48, 30, 0.12);
        }

        .square-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .category-pill {
            background: #fef3c7;
            color: #b45309;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .square-title {
            font-family: 'Newsreader', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1c1917;
            line-height: 1.3;
            margin-bottom: 14px;
        }

        .square-eq-box {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-main);
            border-radius: var(--radius-inner);
            padding: 16px 12px;
            text-align: center;
            font-size: 1.25rem;
            overflow-x: auto;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================================
           DETAIL VIEW CONTAINER
           ============================================================ */
        .detail-view-wrapper {
            display: none;
        }

        .back-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .back-btn {
            background: #ede7da;
            border: 1px solid var(--border-main);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #e5ddca;
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        .exhibit-card {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: var(--radius-main);
            padding: 28px;
            box-shadow: var(--shadow-card);
        }

        .exhibit-card-header {
            margin-bottom: 24px;
        }

        .exhibit-badges-top {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .exhibit-title {
            font-family: 'Newsreader', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #1c1917;
            line-height: 1.25;
        }

        /* EQUATION RENDER BOX */
        .equation-box {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-main);
            border-radius: var(--radius-inner);
            padding: 24px 20px 20px;
            margin-bottom: 24px;
        }

        .equation-render-area {
            text-align: center;
            margin-bottom: 24px;
            padding: 10px 0;
            font-size: 1.75rem;
            overflow-x: auto;
            min-height: 70px;
            cursor: pointer;
        }

        /* Terms Row */
        .terms-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            border-top: 1px dashed var(--border-main);
            padding-top: 16px;
        }

        .term-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #eee8db;
            border: 1px solid var(--border-main);
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            text-decoration: none;
            color: inherit;
        }

        .term-pill:hover {
            border-color: var(--accent-orange);
            background: #fff8ef;
        }

        .term-pill.active {
            background: #fff7ed;
            border: 2px solid #ea580c;
            box-shadow: 0 0 10px rgba(234, 88, 12, 0.2);
        }

        .term-pill .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* DECODER TEXT BOX */
        .decoder-box {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-main);
            border-radius: var(--radius-inner);
            padding: 22px 24px;
            margin-bottom: 24px;
        }

        .decoder-text {
            font-size: 1.05rem;
            line-height: 2.1;
            color: #292524;
        }

        .phrase {
            font-weight: 700;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        .phrase-purple { color: var(--color-purple); }
        .phrase-orange { color: var(--color-orange); }
        .phrase-red { color: var(--color-red); }
        .phrase-teal { color: var(--color-teal); }
        .phrase-green { color: var(--color-green); }
        .phrase-blue { color: var(--color-blue); }

        .phrase.active, .phrase:hover {
            border: 2px solid #ea580c;
            background: #fff7ed;
            box-shadow: 0 0 8px rgba(234, 88, 12, 0.25);
        }

        /* VARIABLE DETAIL CARD */
        .var-detail-card {
            background: var(--bg-card-sub);
            border: 1px solid var(--border-main);
            border-radius: var(--radius-inner);
            padding: 22px;
        }

        .var-detail-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 12px;
        }

        .var-symbol-badge {
            background: #fff7ed;
            border: 1.5px solid #ea580c;
            border-radius: 12px;
            padding: 6px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1c1917;
            box-shadow: 0 2px 8px rgba(234, 88, 12, 0.15);
            flex-shrink: 0;
            min-width: 60px;
            text-align: center;
        }

        .var-info h4 {
            font-family: 'Newsreader', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #1c1917;
            margin-bottom: 2px;
        }

        .var-info p {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .var-tags {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .mini-tag {
            background: #ded6bf;
            color: #57534e;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .var-divider {
            height: 1px;
            background: var(--border-main);
            margin: 12px 0;
        }

        .var-narrative {
            font-size: 0.9rem;
            color: #44403c;
            line-height: 1.6;
        }

        /* Responsive Grid */
        @media (max-width: 820px) {
            .square-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 560px) {
            .square-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- ============================================================
             HEADER (Minimal, Clean)
             ============================================================ -->
        <header class="museum-header">
            <div class="museum-brand" onclick="navigateTo('#')">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"></circle>
                        <polygon points="12 6 15 12 12 18 9 12 12 6"></polygon>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Classic Equations</h1>
                </div>
            </div>

            <nav class="museum-nav">
                <a href="#" class="active" onclick="navigateTo('#')">Catalog</a>
                <a href="#">Timeline</a>
                <a href="#">Mission</a>
            </nav>
        </header>

        <!-- ============================================================
             INITIAL VIEW: 3-COLUMN SCROLLABLE GRID OF CURVED SQUARES
             ============================================================ -->
        <main id="catalogWrapper">
            <div class="square-grid" id="squareGrid">
                <!-- Dynamically populated 3-column square cards -->
            </div>
        </main>

        <!-- ============================================================
             DETAIL VIEW CONTAINER (Opened when square card or #link is selected)
             ============================================================ -->
        <div class="detail-view-wrapper" id="detailWrapper">
            <div class="back-nav-bar">
                <button class="back-btn" onclick="navigateTo('#')">
                    ← Back to Catalog
                </button>
            </div>

            <article class="exhibit-card" id="detailCard">
                <!-- Content dynamically populated when a card is clicked -->
            </article>
        </div>

    </div>

    <!-- ============================================================
         EXHIBIT DATA & ROUTER LOGIC
         ============================================================ -->
    <script>
        const exhibits = [
            {
                id: 'canard-pitch',
                category: 'Aerodynamics',
                title: 'Canard Pitch Stability & Equilibrium',
                previewTex: 'C_m = C_{m0} + \\left( \\frac{x_{cg} - x_{ac}}{c} \\right) C_L - V_{canard} \\, C_{L,canard}',
                terms: [
                    { id: 'Cm', symbol: '\\textcolor{#7e22ce}{C_m}', name: 'Pitching Moment', color: '#7e22ce' },
                    { id: 'Cm0', symbol: '\\textcolor{#ea580c}{C_{m0}}', name: 'Baseline Camber Moment', color: '#ea580c' },
                    { id: 'xcg', symbol: '\\textcolor{#dc2626}{x_{cg} - x_{ac}}', name: 'Gravity Offset', color: '#dc2626' },
                    { id: 'c', symbol: '\\textcolor{#0d9488}{c}', name: 'Wing Chord', color: '#0d9488' },
                    { id: 'CL', symbol: '\\textcolor{#16a34a}{C_L}', name: 'Wing Lift', color: '#16a34a' },
                    { id: 'Vcanard', symbol: '\\textcolor{#2563eb}{V_{canard}}', name: 'Canard Volume Ratio', color: '#2563eb' },
                    { id: 'CLcanard', symbol: '\\textcolor{#ea580c}{C_{L,canard}(\\delta_e)}', name: 'Canard Elevator Control Lift', color: '#ea580c', active: true }
                ],
                decoderHTML: `The <a href="#canard-pitch/Cm" class="phrase phrase-purple" data-term="Cm">total pitching moment</a> equals the <a href="#canard-pitch/Cm0" class="phrase phrase-orange" data-term="Cm0">baseline wing camber moment</a> plus the lift moment from <a href="#canard-pitch/xcg" class="phrase phrase-red" data-term="xcg">gravity offset</a> divided by <a href="#canard-pitch/c" class="phrase phrase-teal" data-term="c">wing chord</a> times <a href="#canard-pitch/CL" class="phrase phrase-green" data-term="CL">wing lift</a>, minus <a href="#canard-pitch/CLcanard" class="phrase phrase-orange phrase-boxed active" data-term="CLcanard">canard elevator control lift</a> scaled by <a href="#canard-pitch/Vcanard" class="phrase phrase-blue" data-term="Vcanard">canard volume ratio</a>.`,
                activeTerm: 'CLcanard',
                getTex: function(activeId) {
                    const c_cm = (activeId === 'Cm') ? '\\boxed{\\textcolor{#7e22ce}{C_m}}' : '\\textcolor{#7e22ce}{C_m}';
                    const c_cm0 = (activeId === 'Cm0') ? '\\boxed{\\textcolor{#ea580c}{C_{m0}}}' : '\\textcolor{#ea580c}{C_{m0}}';
                    const c_xcg = (activeId === 'xcg') ? '\\boxed{\\textcolor{#dc2626}{x_{cg} - x_{ac}}}' : '\\textcolor{#dc2626}{x_{cg} - x_{ac}}';
                    const c_c = (activeId === 'c') ? '\\boxed{\\textcolor{#0d9488}{c}}' : '\\textcolor{#0d9488}{c}';
                    const c_cl = (activeId === 'CL') ? '\\boxed{\\textcolor{#16a34a}{C_L}}' : '\\textcolor{#16a34a}{C_L}';
                    const c_v = (activeId === 'Vcanard') ? '\\boxed{\\textcolor{#2563eb}{V_{canard}}}' : '\\textcolor{#2563eb}{V_{canard}}';
                    const c_clc = (activeId === 'CLcanard') ? '\\boxed{\\textcolor{#ea580c}{C_{L,canard}(\\delta_e)}}' : '\\textcolor{#ea580c}{C_{L,canard}(\\delta_e)}';
                    return `${c_cm} = ${c_cm0} + \\left( \\frac{${c_xcg}}{${c_c}} \\right) ${c_cl} - ${c_v} \\, ${c_clc}`;
                },
                varDetails: {
                    CLcanard: {
                        symbol: 'C_{L,canard}(\\delta_e)',
                        title: 'Canard Elevator Lift Coefficient',
                        desc: 'Upward control lift created by deflecting the forward elevator surface.',
                        tag1: 'Control Input',
                        tag2: 'Ratio [1]',
                        narrative: 'Deflecting the forward lever tilts the canard wing up or down, directly trimming pitch angle and climb trajectory.'
                    },
                    Cm: {
                        symbol: 'C_m',
                        title: 'Net Pitching Moment Coefficient',
                        desc: 'Rotational force trying to pitch the aircraft nose upward or downward.',
                        tag1: 'Pitching Torque',
                        tag2: 'Ratio [1]',
                        narrative: 'When total pitching moment equals zero, the aircraft stays in steady level flight.'
                    },
                    Cm0: {
                        symbol: 'C_{m0}',
                        title: 'Baseline Camber Pitching Moment',
                        desc: 'Inherent nose-down rotation created by curved wing airfoils.',
                        tag1: 'Airfoil Constant',
                        tag2: 'Ratio [1]',
                        narrative: 'Curved wings naturally try to pitch downward, requiring horizontal control surfaces to keep the nose balanced.'
                    },
                    xcg: {
                        symbol: 'x_{cg} - x_{ac}',
                        title: 'Center of Gravity Offset',
                        desc: 'Distance between center of gravity and the wing aerodynamic center.',
                        tag1: 'Static Margin',
                        tag2: 'Meters [m]',
                        narrative: 'Placing gravity ahead of wing lift creates natural pitch stability.'
                    },
                    c: {
                        symbol: 'c',
                        title: 'Mean Aerodynamic Chord',
                        desc: 'Average front-to-back wing width used as reference length.',
                        tag1: 'Reference Width',
                        tag2: 'Meters [m]',
                        narrative: 'Normalizes the gravity offset distance across different aircraft sizes.'
                    },
                    CL: {
                        symbol: 'C_L',
                        title: 'Main Wing Lift Coefficient',
                        desc: 'Amount of upward lift force produced by the primary wings.',
                        tag1: 'Wing Lift Factor',
                        tag2: 'Ratio [1]',
                        narrative: 'As main wing lift grows, it creates rotational pitch torque around the center of gravity.'
                    },
                    Vcanard: {
                        symbol: 'V_{canard}',
                        title: 'Canard Volume Ratio',
                        desc: 'Relative size and leverage arm of the forward elevator.',
                        tag1: 'Leverage Arm',
                        tag2: 'Ratio [1]',
                        narrative: 'Measures how strongly the forward elevator can push the nose up or down.'
                    }
                }
            },
            {
                id: 'prandtl-drag',
                category: 'Aerodynamics',
                title: 'Prandtl Induced Drag & Wing Warping',
                previewTex: 'C_{D_i} = \\frac{C_L^2}{\\pi \\cdot AR \\cdot e}',
                terms: [
                    { id: 'CDi', symbol: '\\textcolor{#dc2626}{C_{D_i}}', name: 'Induced Drag', color: '#dc2626', active: true },
                    { id: 'CL', symbol: '\\textcolor{#16a34a}{C_L^2}', name: 'Lift Squared', color: '#16a34a' },
                    { id: 'AR', symbol: '\\textcolor{#2563eb}{AR}', name: 'Aspect Ratio', color: '#2563eb' },
                    { id: 'e', symbol: '\\textcolor{#7e22ce}{e}', name: 'Span Efficiency', color: '#7e22ce' }
                ],
                decoderHTML: `The <a href="#prandtl-drag/CDi" class="phrase phrase-red phrase-boxed active" data-term="CDi">extra drag created by lift</a> grows with the square of the <a href="#prandtl-drag/CL" class="phrase phrase-green" data-term="CL">lift coefficient</a>, but drops when you increase <a href="#prandtl-drag/AR" class="phrase phrase-blue" data-term="AR">wing aspect ratio</a> or <a href="#prandtl-drag/e" class="phrase phrase-purple" data-term="e">span efficiency</a>.`,
                activeTerm: 'CDi',
                getTex: function(activeId) {
                    const c_cdi = (activeId === 'CDi') ? '\\boxed{\\textcolor{#dc2626}{C_{D_i}}}' : '\\textcolor{#dc2626}{C_{D_i}}';
                    const c_cl = (activeId === 'CL') ? '\\boxed{\\textcolor{#16a34a}{C_L^2}}' : '\\textcolor{#16a34a}{C_L^2}';
                    const c_ar = (activeId === 'AR') ? '\\boxed{\\textcolor{#2563eb}{AR}}' : '\\textcolor{#2563eb}{AR}';
                    const c_e = (activeId === 'e') ? '\\boxed{\\textcolor{#7e22ce}{e}}' : '\\textcolor{#7e22ce}{e}';
                    return `${c_cdi} = \\frac{${c_cl}}{\\pi \\cdot ${c_ar} \\cdot ${c_e}}`;
                },
                varDetails: {
                    CDi: {
                        symbol: 'C_{D_i}',
                        title: 'Induced Drag Coefficient',
                        desc: 'Inevitable backward drag penalty caused whenever a wing generates upward lift.',
                        tag1: 'Vortex Drag',
                        tag2: 'Ratio [1]',
                        narrative: 'Generating lift creates swirling vortices at wingtips that drag the plane backward.'
                    },
                    CL: {
                        symbol: 'C_L^2',
                        title: 'Lift Coefficient Squared',
                        desc: 'Square of the total lift factor.',
                        tag1: 'Lift Multiplier',
                        tag2: 'Ratio [1]',
                        narrative: 'Doubling lift quadruples the induced drag penalty.'
                    },
                    AR: {
                        symbol: 'AR',
                        title: 'Wing Aspect Ratio',
                        desc: 'Ratio of wingspan to wing width.',
                        tag1: 'Wing Shape',
                        tag2: 'Ratio [1]',
                        narrative: 'Long slender glider wings reduce tip vortices and cut induced drag dramatically.'
                    },
                    e: {
                        symbol: 'e',
                        title: 'Span Efficiency Factor',
                        desc: 'How evenly lift is spread across wingspan.',
                        tag1: 'Efficiency Factor',
                        tag2: 'Ratio [1]',
                        narrative: 'Elliptical wings achieve maximum efficiency (e = 1.0).'
                    }
                }
            },
            {
                id: 'navier-stokes',
                category: 'Fluid Mechanics',
                title: 'Navier–Stokes Fluid Dynamics',
                previewTex: '\\rho \\left( \\frac{\\partial \\mathbf{v}}{\\partial t} + \\mathbf{v} \\cdot \\nabla \\mathbf{v} \\right) = -\\nabla p + \\mu \\nabla^2 \\mathbf{v} + \\rho \\mathbf{g}',
                terms: [
                    { id: 'rho', symbol: '\\textcolor{#7e22ce}{\\rho}', name: 'Density', color: '#7e22ce' },
                    { id: 'v', symbol: '\\textcolor{#ea580c}{\\mathbf{v}}', name: 'Velocity', color: '#ea580c', active: true },
                    { id: 'p', symbol: '\\textcolor{#dc2626}{p}', name: 'Pressure', color: '#dc2626' },

                    <div class="terms-row">
                        ${ex.terms.map(t => `
                            <a href="#${ex.id}/${t.id}" class="term-pill ${t.id === ex.activeTerm ? 'active' : ''}" id="detail-term-pill-${t.id}">
                                <span class="dot" style="background: ${t.color}"></span>
                                <span id="detail-term-tex-${t.id}"></span>
                            </a>
                        `).join('')}
                    </div>
                </div>

                <!-- DECODER TEXT BOX -->
                <div class="decoder-box">
                    <div class="decoder-text" id="detail-decoder-text">${ex.decoderHTML}</div>
                </div>

                <!-- VARIABLE DETAIL CARD -->
                <div class="var-detail-card">
                    <div class="var-detail-top">
                        <div class="var-symbol-badge" id="detail-var-symbol"></div>
                        <div class="var-info">
                            <h4 id="detail-var-title">${currentVar.title}</h4>
                            <p id="detail-var-desc">${currentVar.desc}</p>
                            <div class="var-tags">
                                <span class="mini-tag" id="detail-var-tag1">${currentVar.tag1}</span>
                                <span class="mini-tag" id="detail-var-tag2">${currentVar.tag2}</span>
                            </div>
                        </div>
                    </div>
                    <div class="var-divider"></div>
                    <div class="var-narrative" id="detail-var-narrative">${currentVar.narrative}</div>
                </div>
            `;

            // Render equations inside detail view
            safeRenderMath(ex.getTex(ex.activeTerm), 'katex-detail-main');

            ex.terms.forEach(t => {
                safeRenderMath(t.symbol, `detail-term-tex-${t.id}`);
            });

            if (currentVar) {
                safeRenderMath(currentVar.symbol, 'detail-var-symbol');
            }
        }

        // Update active term inside open exhibit detail
        function updateDetailTerm(termId) {
            if (!currentActiveExhibit) return;
            const ex = currentActiveExhibit;
            ex.activeTerm = termId;
            const currentVar = ex.varDetails[termId];
            if (!currentVar) return;

            // Re-render main equation
            safeRenderMath(ex.getTex(termId), 'katex-detail-main');

            // Update term pills active state
            ex.terms.forEach(t => {
                const pill = document.getElementById(`detail-term-pill-${t.id}`);
                if (pill) {
                    if (t.id === termId) pill.classList.add('active');
                    else pill.classList.remove('active');
                }
            });

            // Update decoder active phrase
            const decoder = document.getElementById('detail-decoder-text');
            if (decoder) {
                decoder.querySelectorAll('.phrase').forEach(span => {
                    if (span.getAttribute('data-term') === termId) {
                        span.classList.add('active');
                        span.classList.add('phrase-boxed');
                    } else {
                        span.classList.remove('active');
                        span.classList.remove('phrase-boxed');
                    }
                });
            }

            // Update variable detail card content
            document.getElementById('detail-var-title').innerText = currentVar.title;
            document.getElementById('detail-var-desc').innerText = currentVar.desc;
            document.getElementById('detail-var-tag1').innerText = currentVar.tag1;
            document.getElementById('detail-var-tag2').innerText = currentVar.tag2;
            document.getElementById('detail-var-narrative').innerText = currentVar.narrative;

            safeRenderMath(currentVar.symbol, 'detail-var-symbol');
        }

        // URL Hash Router
        function handleHashRouting() {
            const rawHash = window.location.hash.replace(/^#/, '');
            if (!rawHash || rawHash === '' || rawHash === 'catalog') {
                showCatalogView();
                return;
            }

            const parts = rawHash.split('/');
            const exhibitId = parts[0];
            const termId = parts[1];

            const ex = exhibits.find(e => e.id === exhibitId);
            if (ex) {
                if (currentActiveExhibit && currentActiveExhibit.id === exhibitId && termId) {
                    updateDetailTerm(termId);
                } else {
                    openExhibitDetail(exhibitId, termId);
                }
            } else {
                showCatalogView();
            }
        }

        window.addEventListener('hashchange', handleHashRouting);

        function initApp() {
            renderSquareGrid();
            handleHashRouting();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>

</html>
